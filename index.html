<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>⚡ Smart Meter Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.css" />
    <style>
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: "Source Sans Pro", system-ui, sans-serif; color: #31333f; background: #fff;
      }
      #loading .spinner {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid #e5e7eb; border-top-color: #2563eb;
        animation: spin 0.9s linear infinite;
      }
      #loading small { color: #6b7280; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>⚡ Smart Meter Dashboard ачаалж байна…</div>
      <small>Анх нээхэд Python орчин татагдах тул 20–60 секунд болно.</small>
    </div>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.js";

      // app.py-г энэ хавтаснаас уншина. Dashboard-оо өөрчлөх бол зөвхөн app.py-г засна.
      const controller = mount(
        {
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
          },
          // pandas, numpy нь Pyodide-д аль хэдийн багтсан. plotly-г PyPI-аас суулгана.
          requirements: ["plotly"],
          streamlitConfig: {
            "client.toolbarMode": "viewer",
          },
        },
        document.getElementById("root"),
      );

      // Streamlit гарч ирмэгц ачааллын дэлгэцийг нуух
      const hide = () => document.getElementById("loading")?.remove();
      const observer = new MutationObserver(() => {
        if (document.querySelector("#root [data-testid='stApp']")) {
          hide();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById("root"), { childList: true, subtree: true });
      setTimeout(hide, 120000);
    </script>
  </body>
</html>
